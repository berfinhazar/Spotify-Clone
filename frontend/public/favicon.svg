<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Koyu Arka Plan Degradesi -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F032B"/>
      <stop offset="100%" stop-color="#08000C"/>
    </linearGradient>

    <!-- Pembe - Mor Renk Geçişi -->
    <linearGradient id="waveGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2E93"/>
      <stop offset="50%" stop-color="#D033FF"/>
      <stop offset="100%" stop-color="#7A12FF"/>
    </linearGradient>

    <!-- Ince Çerçeve Çizgisi -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2E93" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7A12FF" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Arka Plan -->
  <rect width="512" height="512" rx="118" fill="url(#bgGradient)"/>
  <rect x="2" y="2" width="508" height="508" rx="116" stroke="url(#borderGrad)" stroke-width="2" fill="none"/>

  <!-- Minimalist Ses Frekansı Sembolü -->
  <g>
    <rect x="136" y="206" width="32" height="100" rx="16" fill="url(#waveGrad)"/>
    <rect x="192" y="146" width="32" height="220" rx="16" fill="url(#waveGrad)"/>
    <rect x="248" y="106" width="32" height="300" rx="16" fill="url(#waveGrad)"/>
    <rect x="304" y="166" width="32" height="180" rx="16" fill="url(#waveGrad)"/>
    <rect x="360" y="226" width="32" height="60" rx="16" fill="url(#waveGrad)"/>
  </g>
</svg>
